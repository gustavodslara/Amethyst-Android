name: Android CI

on:
  push:
    branches: [ "main" ] # Runs on push to main
  pull_request:
    branches: [ "main" ] # Runs on PR to main
  workflow_dispatch: {} # Allows manual triggering

jobs:
  build:

    runs-on: ubuntu-latest # You can change this to ubuntu-22.04 if you prefer

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: "recursive" # Added this from your other workflow

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17' # This fixes the build error
        distribution: 'temurin'
        cache: gradle

    # --- Added these steps from your other workflow ---
    # --- They seem necessary to build your app ---
    - name: Get JRE 8
      uses: dawidd6/action-download-artifact@v9
      with:
        workflow: build.yml
        path: app_pojavlauncher/src/main/assets/components/jre
        workflow_conclusion: success
        repo: AngelAuraMC/angelauramc-openjdk-build
        branch: buildjre8
        name: jre8-pojav

    - name: Get JRE17
      uses: dawidd6/action-download-artifact@v9
      with:
        workflow: build.yml
        path: app_pojavlauncher/src/main/assets/components/jre-new
        workflow_conclusion: success
        repo: AngelAuraMC/angelauramc-openjdk-build
        branch: buildjre17-21
        name: jre17-pojav

    - name: Get JRE21
      uses: dawidd6/action-download-artifact@v9
      with:
        workflow: build.yml
        path: app_pojavlauncher/src/main/assets/components/jre-21
        workflow_conclusion: success
        repo: AngelAuraMC/angelauramc-openjdk-build
        branch: buildjre17-21
        name: jre21-pojav
    # --- End of added steps ---

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew :app_pojavlauncher:assembleDebug

    - name: Upload APK to GitHub Release
      uses: softprops/action-gh-release@v1
      # Only run on a push to main or a manual run, not on a Pull Request
      if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
      with:
        tag_name: TropicaliaCraft # Always upload to this tag
        name: "TropicaliaCraft Build" # Name for the release
        body: "Latest build from main branch or manual run."
        draft: false
        prerelease: false
        make_latest: true # Mark this as the "latest" release
        # This will upload the file from the path specified below.
        files: app_pojavlauncher/build/outputs/apk/debug/app_pojavlauncher-debug.apk
      env:
        # The GITHUB_TOKEN is automatically provided by GitHub Actions
        GITHUB_TOKEN: ${{ secrets.TOKEN }}
